<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>معركة الأنمي - أونلاين</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
    user-select: none;
    touch-action: none;
  }

  /* ===== الشاشات ===== */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .screen.active { display: flex; }

  /* ===== الشاشة الرئيسية ===== */
  #menu {
    background: linear-gradient(180deg, #1a0033 0%, #000 100%);
  }

  h1 {
    font-size: 28px;
    color: #ffcc00;
    text-shadow: 0 0 10px #ff6600;
    margin-bottom: 20px;
    text-align: center;
  }

  .input-box {
    width: 90%;
    max-width: 400px;
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #ffcc00;
    background: #222;
    color: white;
    margin-bottom: 15px;
    text-align: center;
  }

  .btn {
    width: 90%;
    max-width: 400px;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    background: linear-gradient(180deg, #ff8800, #ff4400);
    color: white;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255,100,0,0.5);
  }
  .btn:active { transform: scale(0.97); }

  .btn-blue {
    background: linear-gradient(180deg, #00aaff, #0055cc);
    box-shadow: 0 4px 10px rgba(0,100,255,0.5);
  }

  /* ===== شاشة اختيار الشخصية ===== */
  .chars-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    width: 90%;
    max-width: 500px;
    margin-top: 20px;
  }

  .char-card {
    padding: 20px;
    border-radius: 15px;
    border: 3px solid #fff;
    text-align: center;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
  }
  .char-card.selected { border-color: #ffcc00; box-shadow: 0 0 20px #ffcc00; }

  .goku { background: linear-gradient(180deg, #ff8800, #cc4400); }
  .vegeta { background: linear-gradient(180deg, #0066ff, #003388); }

  /* ===== شاشة الانتظار ===== */
  #waiting .room-code {
    font-size: 50px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #ffcc00;
    text-shadow: 0 0 20px #ff6600;
    padding: 20px;
    background: #222;
    border-radius: 15px;
    border: 2px solid #ffcc00;
    margin: 20px 0;
  }

  .loader {
    border: 4px solid #333;
    border-top: 4px solid #ffcc00;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
    
  /* ===== شاشة اللعبة ===== */
  #game {
    padding: 0;
    justify-content: flex-start;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 8px;
    background: rgba(0,0,0,0.7);
    gap: 10px;
  }

  .hud-player { flex: 1; }

  .hud-name {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 3px;
  }

  .hp-bar {
    width: 100%;
    height: 18px;
    background: #333;
    border: 1px solid #fff;
    border-radius: 4px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    transition: width 0.2s;
  }
  #p1 .hp-fill { background: linear-gradient(90deg, #ff6600, #ffcc00); }
  #p2 .hp-fill { background: linear-gradient(90deg, #0066ff, #00ccff); }

  .energy-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
  }
  .energy-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ff00, #ccff00);
    transition: width 0.2s;
  }

  #gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
  background-image: url('34c84b90c4ccc7ab14a48107e60dfa9c.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #87ceeb;
  object-fit: fill;
  }
  

  /* ===== أزرار التحكم على الجوال ===== */
  #controls {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 220px;
    pointer-events: none;
    display: none;
  }
  #controls.active { display: block; }

  .control-btn {
    position: absolute;
    background: rgba(0,0,0,0.6);
    border: 2px solid #fff;
    border-radius: 50%;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
  }
  .control-btn:active { background: rgba(255,204,0,0.7); }

  .btn-left   { left: 15px;  bottom: 100px; width: 65px; height: 65px; }
  .btn-right  { left: 95px;  bottom: 100px; width: 65px; height: 65px; }
  .btn-jump   { left: 55px;  bottom: 20px;  width: 65px; height: 65px; }

  .btn-punch  { right: 15px; bottom: 140px; width: 60px; height: 60px; font-size: 22px; }
  .btn-skill1 { right: 90px; bottom: 100px; width: 60px; height: 60px; font-size: 20px; }
  .btn-skill2 { right: 15px; bottom: 75px;  width: 60px; height: 60px; font-size: 20px; }
  .btn-ult    { right: 90px; bottom: 30px;  width: 60px; height: 60px; font-size: 22px; }

  #message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 45px;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0 0 20px #ff6600;
    display: none;
    z-index: 100;
    text-align: center;
    background: rgba(0,0,0,0.85);
    padding: 30px;
    border-radius: 20px;
    border: 3px solid #ffcc00;
  }

  #restartBtn {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 18px;
    background: #ff6600;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    display: none;
  }
.hp-text {
  font-size: 11px;
  color: #ffcc00;
  margin-right: 5px;
  font-weight: normal;
    }
  /* ===== رسالة تدوير الشاشة ===== */
  #rotateMsg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    color: #ffcc00;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    text-align: center;
    padding: 20px;
  }
  #rotateMsg h2 {
    font-size: 24px;
    margin: 15px 0;
  }
  #rotateMsg p {
    font-size: 16px;
    color: #fff;
  }
  @media (orientation: portrait) {
    #rotateMsg.active { display: flex; }
    #controls.active { display: none; }
  }
</style>
</head>
<body>

<!-- ===== شاشة البداية ===== -->
<div id="menu" class="screen active">
  <h1>⚔️ معركة الأنمي ⚔️</h1>
  <input type="text" id="playerName" class="input-box" placeholder="اكتب اسمك" maxlength="12">
  <button class="btn" onclick="showCharSelect()">التالي ➡️</button>
</div>

<!-- ===== شاشة اختيار الشخصية ===== -->
<div id="charSelect" class="screen">
  <h1>اختر شخصيتك</h1>
  <div class="chars-grid">
    <div class="char-card goku" onclick="selectChar('goku', this)">
      <div style="font-size:40px;">🟠</div>
      <div>غوكو</div>
    </div>
    <div class="char-card vegeta" onclick="selectChar('vegeta', this)">
      <div style="font-size:40px;">🔵</div>
      <div>فيجيتا</div>
    </div>
  </div>
  <button class="btn" onclick="showRoomOptions()" style="margin-top:30px;">التالي ➡️</button>
</div>

<!-- ===== شاشة الغرفة ===== -->
<div id="roomOptions" class="screen">
  <h1>اللعب الأونلاين</h1>
  <button class="btn" onclick="createRoom()">🎮 أنشئ غرفة</button>
  <button class="btn btn-blue" onclick="showJoinRoom()">🔗 انضم لغرفة</button>
</div>

<!-- ===== شاشة الانضمام ===== -->
<div id="joinRoom" class="screen">
  <h1>انضم لغرفة</h1>
  <input type="text" id="roomCodeInput" class="input-box" placeholder="اكتب كود الغرفة" maxlength="6" style="text-transform:uppercase;">
  <button class="btn" onclick="joinRoom()">انضم</button>
  <button class="btn btn-blue" onclick="showScreen('roomOptions')">رجوع</button>
</div>

<!-- ===== شاشة الانتظار ===== -->
<div id="waiting" class="screen">
  <h1>غرفتك جاهزة!</h1>
  <p>أرسل هذا الكود لصاحبك:</p>
  <div class="room-code" id="roomCodeDisplay">------</div>
  <div class="loader"></div>
  <p>في انتظار صاحبك...</p>
</div>

<!-- ===== شاشة اللعبة ===== -->
<div id="game" class="screen">
  <div id="hud">
    <div class="hud-player" id="p1">
      <div class="hud-name" id="p1name">غوكو <span class="hp-text" id="p1hpText">500/500</span></div>
      <div class="hp-bar"><div class="hp-fill" id="p1hp"></div></div>
      <div class="energy-bar"><div class="energy-fill" id="p1en"></div></div>
    </div>
    <div class="hud-player" id="p2">
      <div class="hud-name" id="p2name">فيجيتا <span class="hp-text" id="p2hpText">500/500</span></div>
      <div class="hp-bar"><div class="hp-fill" id="p2hp"></div></div>
      <div class="energy-bar"><div class="energy-fill" id="p2en"></div></div>
    </div>
  </div>
  
  <canvas id="gameCanvas" width="900" height="450"></canvas>
  
  <div id="message"></div>
  <button id="restartBtn" onclick="restartGame()">🔄 العب مرة ثانية</button>
  
  <div id="controls">
    <div class="control-btn btn-left"   ontouchstart="pressBtn('left', true)"  ontouchend="pressBtn('left', false)">◀</div>
    <div class="control-btn btn-right"  ontouchstart="pressBtn('right', true)" ontouchend="pressBtn('right', false)">▶</div>
    <div class="control-btn btn-jump"   ontouchstart="pressBtn('jump', true)"  ontouchend="pressBtn('jump', false)">⬆</div>
    <div class="control-btn btn-punch"  ontouchstart="pressBtn('punch', true)" ontouchend="pressBtn('punch', false)">👊</div>
    <div class="control-btn btn-skill1" ontouchstart="pressBtn('skill1', true)" ontouchend="pressBtn('skill1', false)">💥</div>
    <div class="control-btn btn-skill2" ontouchstart="pressBtn('skill2', true)" ontouchend="pressBtn('skill2', false)">⚡</div>
    <div class="control-btn btn-ult"    ontouchstart="pressBtn('ult', true)"    ontouchend="pressBtn('ult', false)">🔥</div>
  </div>
</div>

<!-- ===== رسالة تدوير الشاشة ===== -->
<div id="rotateMsg">
  <div style="font-size:70px;">🔄</div>
  <h2>دوّر جوالك للعرض</h2>
  <p>عشان تلعب بشكل أفضل</p>
</div>

<script>
  // ===== إعداد Firebase =====
  const firebaseConfig = {
    apiKey: "AIzaSyCX8nbhYIZGUZHx8Aa-3jqM2WmsS2d1hts",
    authDomain: "character-battle.firebaseapp.com",
    databaseURL: "https://character-battle-default-rtdb.firebaseio.com",
    projectId: "character-battle",
    storageBucket: "character-battle.firebasestorage.app",
    messagingSenderId: "391375079008",
    appId: "1:391375079008:web:d500901f45917d30e7e505"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ===== المتغيرات الأساسية =====
  let playerName = '';
  let playerChar = 'goku';
  let myRole = null;
  let roomCode = '';
  let roomRef = null;
  let connection = null;
  
  // نقل بين الشاشات
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  
  function showCharSelect() {
    const name = document.getElementById('playerName').value.trim();
    if (!name) { alert('اكتب اسمك أول!'); return; }
    playerName = name;
    showScreen('charSelect');
  }
  
  function selectChar(char, el) {
    playerChar = char;
    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }
  
  function showRoomOptions() {
    if (!playerChar) { alert('اختر شخصية!'); return; }
    showScreen('roomOptions');
  }
  
  function showJoinRoom() {
    showScreen('joinRoom');
  }

  // ===== تدوير الشاشة =====
  function tryLockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(err => {
        console.log('ما قدرنا ندوّر تلقائياً:', err);
      });
    }
  }
  
  function checkOrientation() {
    const rotateMsg = document.getElementById('rotateMsg');
    if (!rotateMsg) return;
    
    if (window.innerHeight > window.innerWidth) {
      rotateMsg.classList.add('active');
    } else {
      rotateMsg.classList.remove('active');
    }
  }
  
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);

  // ===== الأونلاين بـ Firebase =====
  
  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
  }
  
  function createRoom() {
    myRole = 'host';
    roomCode = generateRoomCode();
    
    showScreen('waiting');
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    
    roomRef = db.ref('rooms/' + roomCode);
    
    roomRef.set({
      createdAt: Date.now(),
      host: {
        name: playerName,
        char: playerChar,
        ready: false
      }
    }).then(() => {
      console.log('الغرفة جاهزة:', roomCode);
      
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        
        if (data.guest && !connection) {
          connection = {
            guest: data.guest,
            send: (msg) => {
              if (msg.type === 'state') {
                roomRef.child('hostState').set(msg);
              } else if (msg.type === 'hit') {
                roomRef.child('guestHp').transaction(hp => (hp || 100) - msg.damage);
              } else if (msg.type === 'special') {
                roomRef.child('hostSpecial').set({ skill: msg.skill, time: Date.now() });
              }
            }
          };
          
          enemyName = data.guest.name;
          enemyChar = data.guest.char;
          
          startGame();
          setupFirebaseListeners();
        }
      });
    }).catch(err => {
      alert('خطأ: ' + err.message);
    });
  }
  
  function joinRoom() {
    myRole = 'guest';
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (code.length !== 6) { alert('الكود لازم يكون 6 حروف/أرقام!'); return; }
    
    showScreen('waiting');
    document.querySelector('#waiting h1').textContent = 'جاري الاتصال...';
    document.getElementById('roomCodeDisplay').textContent = code;
    
    roomRef = db.ref('rooms/' + code);
    
    roomRef.once('value').then(snapshot => {
      const data = snapshot.val();
      
      if (!data) {
        alert('الغرفة غير موجودة! تأكد من الكود');
        showScreen('roomOptions');
        return;
      }
      
      if (data.guest) {
        alert('الغرفة ممتلئة!');
        showScreen('roomOptions');
        return;
      }
      
      roomRef.child('guest').set({
        name: playerName,
        char: playerChar,
        joinedAt: Date.now()
      });
      
      enemyName = data.host.name;
      enemyChar = data.host.char;
      roomCode = code;
      
      startGame();
      setupFirebaseListeners();
      
    }).catch(err => {
      alert('خطأ: ' + err.message);
    });
  }
  
  function setupFirebaseListeners() {
    if (!roomRef) return;
    
    const opponentKey = myRole === 'host' ? 'guestState' : 'hostState';
    roomRef.child(opponentKey).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        updateEnemyFromFirebase(data);
      }
    });
    
    const specialKey = myRole === 'host' ? 'guestSpecial' : 'hostSpecial';
    roomRef.child(specialKey).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.time && Date.now() - data.time < 1000) {
        if (enemyFighter && myFighter) {
          enemyFighter.specialAttack(myFighter, data.skill);
        }
      }
    });
    
    const hpKey = myRole === 'host' ? 'hostHp' : 'guestHp';
    roomRef.child(hpKey).on('value', (snapshot) => {
      const hp = snapshot.val();
      if (hp !== null && myFighter) {
        myFighter.hp = hp;
        if (hp <= 0) endGame(enemyName);
      }
    });
  }
  
  function sendState() {
    if (!roomRef || !myFighter) return;
    
    const stateKey = myRole === 'host' ? 'hostState' : 'guestState';
    roomRef.child(stateKey).set({
      x: myFighter.x,
      y: myFighter.y,
      facing: myFighter.facing,
      hp: myFighter.hp,
      energy: myFighter.energy,
      attacking: myFighter.attackTimer > 0
    });
  }
  
  function updateEnemyFromFirebase(data) {
    if (!enemyFighter) return;
    enemyTargetX = data.x;
    enemyTargetY = data.y;
    enemyFighter.facing = data.facing;
    enemyFighter.hp = data.hp;
    enemyFighter.energy = data.energy;
    if (data.attacking) enemyFighter.attackTimer = 10;
  }
// ===== اللعبة =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let GROUND = 300;
let gameOver = false;
let myFighter = null;
let enemyFighter = null;
let enemyName = 'الخصم';
let enemyChar = 'vegeta';
let enemyTargetX = 0, enemyTargetY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
GROUND = canvas.height - 100;
  }
window.addEventListener('resize', () => {

  checkOrientation();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    
    checkOrientation();
  }, 300);
});

class Fighter {
  constructor(x, color, name, facing) {
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.width = 50;
    this.height = 70;
    this.color = color;
    this.name = name;
    this.facing = facing;
    this.hp = 500;
    this.maxHp = 500;
    this.energy = 0;
    this.maxEnergy = 100;
    this.onGround = true;
    this.attackCooldown = 0;
    this.attackTimer = 0;
    this.hitFlash = 0;
    this.specialActive = null;
    this.specialTimer = 0;
    this.specialData = null;
  }
  
  update() {
    if (gameOver) return;
    this.vy += 0.8;
    this.y += this.vy;
    if (this.y >= GROUND) {
      this.y = GROUND;
      this.vy = 0;
      this.onGround = true;
    }
    this.x += this.vx;
    this.vx *= 0.85;
    if (this.x < 30) this.x = 30;
    if (this.x > canvas.width - 30) this.x = canvas.width - 30;
    this.energy = Math.min(this.maxEnergy, this.energy + 0.3);
    if (this.attackCooldown > 0) this.attackCooldown--;
    if (this.attackTimer > 0) this.attackTimer--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.specialTimer > 0) {
      this.specialTimer--;
      if (this.specialTimer <= 0) this.specialActive = null;
    }
  }
  
  draw() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(this.x, GROUND + 5, this.width/1.5, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = this.hitFlash > 0 ? '#fff' : this.color;
    ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
    ctx.beginPath();
    ctx.arc(this.x, this.y - this.height - 12, 18, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(this.x + this.facing * 5, this.y - this.height - 15, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x + this.facing * 11, this.y - this.height - 15, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, this.x, this.y - this.height - 38);
    if (this.attackTimer > 0) {
      ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
      ctx.beginPath();
      ctx.arc(this.x + this.facing * 40, this.y - this.height/2, 22, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
  
  move(dir) {
    if (gameOver) return;
    this.vx = dir * 5;
    this.facing = dir;
  }
  
  jump() {
    if (gameOver) return;
    if (this.onGround) {
      this.vy = -14;
      this.onGround = false;
    }
  }
  
  meleeAttack(target) {
    if (gameOver || !target) return;
    if (this.attackCooldown > 0) return;
    this.attackTimer = 10;
    this.attackCooldown = 25;
    const attackX = this.x + this.facing * 40;
    const dist = Math.abs(attackX - target.x);
    const vertDist = Math.abs((this.y - this.height/2) - (target.y - target.height/2));
    if (dist < 45 && vertDist < 60) {
      target.takeDamage(40);
      if (roomRef) {
        const hpKey = myRole === 'host' ? 'guestHp' : 'hostHp';
        roomRef.child(hpKey).transaction(hp => (hp || 500) - 40);
      }
    }
  }
  
  specialAttack(target, type) {
    if (gameOver || !target) return;
    if (this.attackCooldown > 0) return;
    const cost = type === 'ult' ? 50 : 25;
    if (this.energy < cost) return;
    this.energy -= cost;
    this.attackCooldown = 40;
    this.specialActive = type;
    this.specialTimer = 30;
    this.specialData = {
      startX: this.x,
      startY: this.y - this.height/2,
      targetX: target.x,
      targetY: target.y - target.height/2,
      damage: type === 'ult' ? 125 : 75
    };
    if (roomRef) {
      const specialKey = myRole === 'host' ? 'hostSpecial' : 'guestSpecial';
      roomRef.child(specialKey).set({ skill: type, time: Date.now() });
    }
  }
  
  takeDamage(amount) {
    this.hp -= amount;
    this.hitFlash = 10;
    if (this.hp <= 0) {
      this.hp = 0;
      endGame(this.name);
    }
  }
  }
  function startGame() {
  showScreen('game');
  tryLockLandscape();
  setTimeout(() => {
    checkOrientation();
    resizeCanvas();
    let myColor, enemyColor;
    myColor = playerChar === 'goku' ? '#ff8800' : '#0066ff';
    enemyColor = playerChar === 'goku' ? '#0066ff' : '#ff8800';
    
    myFighter = new Fighter(120, myColor, playerName, 1);
    enemyFighter = new Fighter(canvas.width - 120, enemyColor, enemyName, -1);
    document.getElementById('controls').classList.add('active');
    document.getElementById('p1name').textContent = playerName;
    document.getElementById('p2name').textContent = enemyName;
    
    if (myRole === 'host') {
      roomRef.child('guestState').once('value').then(snap => {
        if (snap.val()) updateEnemyFromFirebase(snap.val());
      });
    }
    
    gameLoop();
  }, 300);
}

const btnState = {};

function pressBtn(btn, pressed) {
  btnState[btn] = pressed;
  if (!myFighter || gameOver) return;
  if (pressed) {
    if (btn === 'jump') myFighter.jump();
    if (btn === 'punch') myFighter.meleeAttack(enemyFighter);
    if (btn === 'skill1') myFighter.specialAttack(enemyFighter, 'skill1');
    if (btn === 'skill2') myFighter.specialAttack(enemyFighter, 'skill2');
    if (btn === 'ult') myFighter.specialAttack(enemyFighter, 'ult');
  }
}

let lastSendTime = 0;

function gameLoop() {
  if (!myFighter || gameOver) return;
  if (btnState['left']) myFighter.move(-1);
  else if (btnState['right']) myFighter.move(1);
  else myFighter.vx *= 0.7;
  
  myFighter.update();
  if (enemyFighter) enemyFighter.update();
  
  const now = Date.now();
  if (now - lastSendTime > 50) {
    sendState();
    lastSendTime = now;
  }
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // رسم خط الأرض (شبه شفاف — الخلفية تظهر من ورا)
  ctx.fillStyle = 'rgba(139, 115, 85, 0.3)';
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  
  if (enemyFighter) {
    enemyFighter.x = enemyTargetX || enemyFighter.x;
    enemyFighter.y = enemyTargetY || enemyFighter.y;
    enemyFighter.draw();
  }
  myFighter.draw();
  
  [myFighter, enemyFighter].forEach(fighter => {
    if (fighter && fighter.specialActive && fighter.specialData) {
      const d = fighter.specialData;
      const progress = (30 - fighter.specialTimer) / 30;
      const cx = d.startX + (d.targetX - d.startX) * Math.min(progress * 1.5, 1);
      const cy = d.startY + (d.targetY - d.startY) * Math.min(progress * 1.5, 1);
      const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 35);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.5, fighter === myFighter ? '#00ccff' : '#ffcc00');
      gradient.addColorStop(1, 'rgba(0,100,255,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, Math.PI*2);
      ctx.fill();
      const target = fighter === myFighter ? enemyFighter : myFighter;
      if (target) {
        const dist = Math.hypot(cx - target.x, cy - (target.y - target.height/2));
        if (dist < 50 && fighter.specialTimer > 25) {
          target.takeDamage(d.damage);
          fighter.specialData = null;
          fighter.specialActive = null;
          fighter.specialTimer = 0;
        }
      }
    }
  });
  
  document.getElementById('p1hp').style.width = (myFighter.hp / myFighter.maxHp * 100) + '%';
document.getElementById('p1en').style.width = (myFighter.energy / 100 * 100) + '%';
document.getElementById('p1hpText').textContent = Math.max(0, Math.round(myFighter.hp)) + '/' + myFighter.maxHp;
if (enemyFighter) {
  document.getElementById('p2hp').style.width = (enemyFighter.hp / enemyFighter.maxHp * 100) + '%';
  document.getElementById('p2en').style.width = (enemyFighter.energy / 100 * 100) + '%';
  document.getElementById('p2hpText').textContent = Math.max(0, Math.round(enemyFighter.hp)) + '/' + enemyFighter.maxHp;
}
  
  requestAnimationFrame(gameLoop);
}

function endGame(winnerName) {
  gameOver = true;
  const msg = document.getElementById('message');
  msg.textContent = '🏆 ' + winnerName + ' فاز!';
  msg.style.display = 'block';
  document.getElementById('restartBtn').style.display = 'block';
}

function restartGame() {
  location.reload();
        }

</script>
